gap: 'Recommended to the provider: publish an AsyncAPI 3.0 document for the Data Messages topic and an
  XSD for the six feed groups. Today a subscriber cannot know the message shape until Dealogic''s own
  loader parses it for them, which is the definition of a bespoke connector.'
