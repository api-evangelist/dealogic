detail: 'Dealogic ships no AsyncAPI document and no webhook catalog, and none of the eight OpenAPI documents
  declares a `webhooks` block. It does, however, operate a real push surface, described in prose only:
  the Dealogic Data Loader ''can connect to a service bus to consume Dealogic (push) Data Messages continuously'',
  as an alternative to pulling feed files from the secure FTP server on a schedule. The client subscribes
  to its own topic. No topic naming convention, message schema, protocol binding (the CT record and Azure
  hosting suggest Azure Service Bus, which is inference, not a published fact), delivery guarantee or
  replay policy is published anywhere public. There is nothing verbatim to save and nothing that can be
  derived without fabricating the message shapes, so no AsyncAPI document is written and no AsyncAPI or
  Webhooks pointer is wired into apis.yml.'
