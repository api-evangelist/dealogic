kind: company
description: 'Dealogic is a global provider of content and software for the capital markets — deal management,
  analytics, league tables and compliance — used by investment banks, syndicate and sales/trading desks,
  investment managers and corporates, and is part of ION Analytics. Its platforms are Cortex, Dealogic
  Connect, Analytics and ComplianceManager. Dealogic runs no developer portal of its own: its APIs are
  catalogued on the ION Analytics Data Portal, and eight OpenAPI 3.0.1 documents covering 153 operations
  are served from Dealogic''s own Swagger UIs on spac/bank/company/sponsor.analytics.dealogic.com, api.reporting.dealogic.com,
  api.reporting.cortex.dealogic.com and api.profiles.dealogic.com. The SPAC API is OData v4; the rest
  are plain REST. All are read-only and gated by OAuth 2.0 at login.dealogic.com with one ''dealogic''
  scope — no self-service signup, no published pricing, no SDK. Bulk delivery is the Primary Market Deals
  & Entities Feed: XML over secure FTP or a service bus.'
apis:
- name: Dealogic Primary Market Deals & Entities Feed
  description: >-
    File-based bulk data feed of Dealogic's investment banking content: over 2 million transactions since
    1995 across Equity Capital Markets, Debt Capital Markets, syndicated loans and M&A, plus 1.1 million
    entities (issuers, banks, financial sponsors, lawyers) and Dealogic Revenue Analytics. XML files in
    six groups (Reference, Company, DCM, ECM, M&A, Loan) are posted to the Dealogic secure FTP server,
    or pushed continuously over a service bus topic, and loaded into a predefined MS SQL Server schema
    by the client-installed Dealogic Data Loader application. Delivery is up to hourly; authentication
    is username/password on the SFTP server. This is a file/message feed, not an HTTP API, so it has no
    HTTP base URL.
  humanURL: >-
    https://iongroup.com/analytics/data-portal/apis-data-feeds/dealogic-origination-data-feed/documentation/
