- name: IONA Profiles API
  description: 'Deal- and market-profile API served from Dealogic infrastructure: DCM and loan deal profiles
    by deal id, US leveraged-finance market profiles for high yield (priced deals, in-market deals, secondary
    price distribution, commentary, volumes by rating, wide-vs-in-line-vs-tight, bond yields by rating,
    distressed bond index summary) and for leveraged loans (priced deals, in-market deals, secondary price
    distribution, commentary, CLO volumes, wide-vs-tight, new-money-vs-refinance, loan pricing by rating),
    plus organization SPAC profile sections. OAuth 2.0 bearer tokens from login.dealogic.com. OWNERSHIP:
    info.title reads ''IONA.Profiles.API'' - IONA is ION Analytics, the parent brand Dealogic belongs
    to (''(c) 2026 Dealogic, part of ION Analytics'', https://dealogic.com/security/). It is attributed
    to Dealogic because it is served from a Dealogic-controlled host (api.profiles.dealogic.com), authenticated
    by the Dealogic identity provider (login.dealogic.com), and its content is Dealogic origination data.
    The sibling ION Analytics APIs served from api.acuris.com are NOT attributed here.'
