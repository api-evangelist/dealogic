  description: 'Read API returning Dealogic bank-profile analytics for a given bank identifier: overall
    bank ranking plus rankings by region, industry and product, top deals, recently completed deals and
    pipeline deals, top fee-paying clients, top lending commitments broken out by region and industry,
    and financial-sponsor rankings. Every operation is scoped by region, product, dateType, basisType
