- name: Dealogic Primary Market Deals & Entities Feed
  description: 'File-based bulk data feed of Dealogic''s investment banking content: over 2 million transactions
    since 1995 across Equity Capital Markets, Debt Capital Markets, syndicated loans and M&A, plus 1.1
    million entities (issuers, banks, financial sponsors, lawyers) and Dealogic Revenue Analytics. XML
    files in six groups (Reference, Company, DCM, ECM, M&A, Loan) are posted to the Dealogic secure FTP
    server, or pushed continuously over a service bus topic, and loaded into a predefined MS SQL Server
    schema by the client-installed Dealogic Data Loader application. Delivery is up to hourly; authentication
    is username/password on the SFTP server. This is a file/message feed, not an HTTP API, so it has no
    HTTP base URL.'
  humanURL: https://iongroup.com/analytics/data-portal/apis-data-feeds/dealogic-origination-data-feed/documentation/
  tags:
