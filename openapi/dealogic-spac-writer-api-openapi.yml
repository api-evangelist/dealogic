openapi: 3.2.0
info:
  title: Dealogic Analytics Spac Spac Writer API
  version: '1.0'
servers:
- url: /
  description: Dealogic Analytics Spac API
security:
- oauth2: []
tags:
- name: Spac Writer
paths:
  /api/SpacLoader/LoadEntity:
    get:
      tags:
      - Spac Writer
      parameters:
      - name: entityName
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: entityId
        in: query
        schema:
          type: integer
          format: int64
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
      summary: Get api spac loader load entity
      x-summary-source: derived
      operationId: getApiSpacLoaderLoadEntity
      x-operation-id-source: derived
  /api/SpacLoader/LoadEntities:
    post:
      tags:
      - Spac Writer
      parameters:
      - name: entityName
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      requestBody:
        content:
          application/json;odata.metadata=minimal;odata.streaming=true:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json;odata.metadata=minimal;odata.streaming=false:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json;odata.metadata=minimal:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json;odata.metadata=full;odata.streaming=true:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json;odata.metadata=full;odata.streaming=false:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json;odata.metadata=full:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json;odata.metadata=none;odata.streaming=true:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json;odata.metadata=none;odata.streaming=false:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json;odata.metadata=none:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json;odata.streaming=true:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json;odata.streaming=false:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/xml:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/prs.odatatestxx-odata:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/json-patch+json:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          text/json:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
          application/*+json:
            schema:
              type:
              - array
              - 'null'
              items:
                type: integer
                format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
      summary: Create api spac loader load entities
      x-summary-source: derived
      operationId: postApiSpacLoaderLoadEntities
      x-operation-id-source: derived
  /api/SpacLoader/GetLoadedEntityIds:
    get:
      tags:
      - Spac Writer
      parameters:
      - name: entityName
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
      summary: Get api spac loader get loaded entity ids
      x-summary-source: derived
      operationId: getApiSpacLoaderGetLoadedEntityIds
      x-operation-id-source: derived
  /api/SpacLoader/TriggerLoadAll:
    post:
      tags:
      - Spac Writer
      summary: (Re)Loads the specified entity from hub (EcmDeal, Location, DealogicIndustry…
      parameters:
      - name: entityName
        in: query
        description: The name of the entity to load (EcmDeal, Location, DealogicIndustry, InterestRate) or the name of custom operation (CalculateLiquidation, CompanyHubCleanup)
        schema:
          type:
          - string
          - 'null'
          description: The name of the entity to load (EcmDeal, Location, DealogicIndustry, InterestRate) or the name of custom operation (CalculateLiquidation, CompanyHubCleanup)
          default: EcmDeal
      - name: maxCount
        in: query
        description: The maximum number of entity to update. Use zero to load all
        schema:
          type: integer
          description: The maximum number of entity to update. Use zero to load all
          format: int32
          default: 0
      - name: maxFailureCount
        in: query
        description: The maximum count of the reported failures
        schema:
          type: integer
          description: The maximum count of the reported failures
          format: int32
          default: 30
      - name: batchSize
        in: query
        description: The number of entities to update in a single batch. Use zero for sequential load. Please note it is NOT the degree of parallelism
        schema:
          type: integer
          description: The number of entities to update in a single batch. Use zero for sequential load. Please note it is NOT the degree of parallelism
          format: int32
          default: 200
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadAllKey'
      operationId: postApiSpacLoaderTriggerLoadAll
      x-operation-id-source: derived
  /api/SpacLoader/GetLoadAllStatus:
    get:
      tags:
      - Spac Writer
      parameters:
      - name: idPrefix
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: maxCount
        in: query
        schema:
          type: integer
          format: int32
          default: 5
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoadAllStatus'
      summary: Get api spac loader get load all status
      x-summary-source: derived
      operationId: getApiSpacLoaderGetLoadAllStatus
      x-operation-id-source: derived
  /api/SpacLoader/TerminateLoadAll:
    post:
      tags:
      - Spac Writer
      summary: Terminates a running LoadAll operation
      parameters:
      - name: id
        in: query
        description: The instance id of the load all operation
        schema:
          type:
          - string
          - 'null'
          description: The instance id of the load all operation
      - name: reason
        in: query
        description: The reason of the termination request
        schema:
          type:
          - string
          - 'null'
          description: The reason of the termination request
          default: Cancelled by user
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
      operationId: postApiSpacLoaderTerminateLoadAll
      x-operation-id-source: derived
  /api/SpacLoader/GetErrors:
    get:
      tags:
      - Spac Writer
      parameters:
      - name: timestamp
        in: query
        schema:
          type: string
          format: date-time
      - name: entityName
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoadError'
      summary: Get api spac loader get errors
      x-summary-source: derived
      operationId: getApiSpacLoaderGetErrors
      x-operation-id-source: derived
  /api/SpacLoader/DeleteError:
    get:
      tags:
      - Spac Writer
      parameters:
      - name: id
        in: query
        schema:
          type: integer
          format: int64
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
      summary: Get api spac loader delete error
      x-summary-source: derived
      operationId: getApiSpacLoaderDeleteError
      x-operation-id-source: derived
  /api/SpacLoader/TriggerLoadAllFailed:
    post:
      tags:
      - Spac Writer
      parameters:
      - name: timestamp
        in: query
        schema:
          type: string
          format: date-time
      - name: entityName
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: maxCount
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: api-version
        in: query
        description: The requested API version
        required: true
        schema:
          type: string
          default: '1.0'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadAllKey'
      summary: Create api spac loader trigger load all failed
      x-summary-source: derived
      operationId: postApiSpacLoaderTriggerLoadAllFailed
      x-operation-id-source: derived
components:
  schemas:
    LoadError:
      required:
      - entityId
      - entityName
      - timestamp
      type: object
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        entityId:
          type: integer
          format: int64
        entityName:
          maxLength: 256
          type: string
        responseStatusCode:
          type: integer
          format: int32
        errorMessage:
          type:
          - string
          - 'null'
        exceptionType:
          type:
          - string
          - 'null'
      additionalProperties: false
    LoadAllStatus:
      type: object
      properties:
        runtimeStatus:
          type:
          - string
          - 'null'
        customStatus: {}
        lastUpdatedTime:
          type: string
          format: date-time
        output:
          type:
          - string
          - 'null'
        instanceId:
          type:
          - string
          - 'null'
      additionalProperties: false
    LoadAllKey:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://login.dealogic.com/as/authorization.oauth2
          tokenUrl: https://login.dealogic.com/as/token.oauth2
          scopes: {}
