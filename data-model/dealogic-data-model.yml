summary:
  entities: 232
  relationships: 235
  root: 'SpacEntry is the aggregate root of the SPAC dataset: it carries 230 scalar fields and 35 relationship
    fields, and every OData navigation path in dealogic-analytics-spac-v2-openapi.json hangs off it.'
  note: 'The four analytics/reporting APIs (Bank, Company, Sponsor, Reporting, Cortex Reporting) are report-shaped
    rather than entity-shaped: their schemas are chart/table payloads keyed by bankIdentifier, companyId,
    sponsorId or reportId, with very few $ref links between them. The IONA Profiles API is deal-shaped
    (DcmDeal, LoanDeal) plus market-profile payloads.'
