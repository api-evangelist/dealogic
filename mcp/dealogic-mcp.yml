candidate_tools:
- name: list_spacs
  maps_to: GET /odata/SpacEntry
  api: Dealogic Analytics SPAC API
  description: List SPAC entries, with OData $filter, $select, $orderby, $top and $skip.
  inputs:
  - $filter
  - $select
  - $orderby
  - $top
  - $skip
  - $count
- name: get_spac
  maps_to: GET /odata/SpacEntry/{key}
  api: Dealogic Analytics SPAC API
  description: Fetch one SPAC entry by key, optionally expanding related entities.
  inputs:
  - key
  - $select
  - $expand
- name: get_spac_listings
  maps_to: GET /odata/SpacEntry({key})/Listings
  api: Dealogic Analytics SPAC API
  description: List the exchange listings attached to a SPAC entry.
  inputs:
  - key
  - $filter
  - $top
- name: get_spac_ipo_syndicate
  maps_to: GET /odata/SpacEntry({key})/IpoSyndicate
  api: Dealogic Analytics SPAC API
  description: List the banks in a SPAC's IPO syndicate.
  inputs:
  - key
- name: get_spac_related_ecm_deals
  maps_to: GET /odata/SpacEntry({key})/RelatedEcmDeals
  api: Dealogic Analytics SPAC API
  description: List ECM deals related to a SPAC entry.
  inputs:
  - key
  - $filter
  - $top
- name: get_spac_expand_expression
  maps_to: GET /api/SpacReader/GetAllDepthExpand
  api: Dealogic Analytics SPAC API
  description: Return the full-depth $expand expression for an entity, so a caller does not have to assemble
    it.
  inputs:
  - entityName
- name: get_bank_ranking
  maps_to: GET /{bankIdentifier}/BankRanking
  api: Dealogic Analytics Bank API
  description: League-table ranking for a bank, scoped by region, product, date type, basis type and year.
  inputs:
  - bankIdentifier
  - region
  - product
  - dateType
  - basisType
  - latestYear
- name: get_bank_top_deals
  maps_to: GET /{bankIdentifier}/Deals/TopDeals
  api: Dealogic Analytics Bank API
  description: A bank's top deals for the selected scope.
  inputs:
  - bankIdentifier
  - region
  - product
  - dateType
  - basisType
  - latestYear
- name: get_bank_top_fee_payers
  maps_to: GET /{bankIdentifier}/Clients/TopFeePayers
  api: Dealogic Analytics Bank API
  description: A bank's top fee-paying clients.
  inputs:
  - bankIdentifier
  - region
  - product
  - dateType
  - basisType
  - latestYear
- name: check_bank_profiles
  maps_to: POST /CheckBankProfiles
  api: Dealogic Analytics Bank API
  description: Confirm which bank identifiers have a profile before spending calls on them.
  inputs:
  - bankIdentifiers[]
- name: get_company_banking_relationships
  maps_to: GET /{companyId}/BankingRelationships
  api: Dealogic Analytics Company API
  description: A company's banking relationships over a date range, region and product.
  inputs:
  - companyId
  - dateRange
  - region
  - product
- name: get_company_debt_maturing
  maps_to: GET /{companyId}/DebtMaturing
  api: Dealogic Analytics Company API
  description: A company's upcoming debt maturities.
  inputs:
  - companyId
  - dateRange
  - industry
  - product
- name: get_sponsor_investment_activity
  maps_to: GET /{sponsorId}/InvestmentActivity
  api: Dealogic Analytics Sponsor API
  description: A financial sponsor's investment activity over time.
  inputs:
  - sponsorId
- name: get_sponsor_portfolio_entries
  maps_to: GET /{sponsorId}/PortfolioCompanies/Entry
  api: Dealogic Analytics Sponsor API
  description: Portfolio-company entries for a sponsor.
  inputs:
  - sponsorId
- name: execute_report
  maps_to: GET /api/v1.0/Data/{ReportId}/{ValidDatesType}
  api: Dealogic Reporting API
  description: Execute a saved report and return its rows.
  inputs:
  - ReportId
  - ValidDatesType
  - toleranceLevel
- name: get_report_definition
  maps_to: GET /api/v1.0/ReportDefinition/{ReportId}
  api: Dealogic Reporting API
  description: Fetch a saved report's definition so an agent knows the columns before executing it.
  inputs:
  - ReportId
- name: get_levfin_market_profile
  maps_to: GET /v1/MarketProfile/USLevfin/HY/PricedDeals
  api: IONA Profiles API
  description: US leveraged-finance high-yield priced deals (one of sixteen market-profile sections).
  inputs:
  - clientCode
  - region
- name: get_dcm_deal
  maps_to: GET /v1/Deal/Dcm/{id}
  api: IONA Profiles API
  description: Fetch a debt capital markets deal profile by id.
  inputs:
  - id
  - clientCode
